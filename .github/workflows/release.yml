name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: Validate release tag
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tags must use vX.Y.Z, got $tag"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags must point at a commit on main"
            exit 1
          fi
      - name: Verify Go source
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          git diff --check
          go vet ./...
          go test -shuffle=on -count=1 -timeout 10m ./...
      - name: Verify repository policy
        run: |
          python3 ./scripts/test_check_public_tree.py
          python3 ./scripts/check_public_tree.py
          for script in deploy/*.sh scripts/*.sh; do
            sh -n "$script"
          done
          sh ./deploy/test-deploy-scripts.sh
      - name: Verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend run typecheck
          npm --prefix frontend test
      - name: Build tagged Linux release
        run: ./deploy/build-linux.sh
      - name: Attest release binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ".dist/sbmgr-*-linux-amd64"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .dist/sbmgr-*-linux-amd64 \
            .dist/sbmgr-*-linux-amd64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
