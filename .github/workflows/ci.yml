name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-build Linux AMD64
        run: |
          mkdir -p .dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o .dist/sbmgr-ci-linux-amd64 ./cmd/sbmgr
      - name: Build tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./deploy/build-linux.sh
      - name: Upload CI binary
        uses: actions/upload-artifact@v4
        with:
          name: sbmgr-linux-amd64
          path: .dist/sbmgr-*-linux-amd64
          if-no-files-found: error
