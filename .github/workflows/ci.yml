name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check public repository tree
        run: python3 ./scripts/check_public_tree.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Compile Go packages
        run: go test ./...
      - name: Check shell script syntax
        run: for script in deploy/*.sh scripts/*.sh; do sh -n "$script"; done
      - name: Cross-build Linux AMD64
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p .dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o .dist/sbmgr-ci-linux-amd64 ./cmd/sbmgr
      - name: Build tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./deploy/build-linux.sh
      - name: Attest tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '.dist/sbmgr-*-linux-amd64'
      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbmgr-linux-amd64
          include-hidden-files: true
          path: |
            .dist/sbmgr-*-linux-amd64
            .dist/sbmgr-*-linux-amd64.sha256
          if-no-files-found: error
