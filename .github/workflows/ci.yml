name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check public repository tree
        run: |
          python3 ./scripts/test_check_public_tree.py
          python3 ./scripts/check_public_tree.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd)"
      - name: Vet
        run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Test
        shell: bash
        run: |
          test_log="$(mktemp)"
          if go test ./... 2>&1 | tee "$test_log"; then
            exit 0
          fi
          summary="$(tail -n 20 "$test_log" | tr '\n' ' ')"
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\r'/'%0D'}"
          summary="${summary//$'\n'/'%0A'}"
          printf '::error title=Go test failed::%s\n' "$summary"
          exit 1
      - name: Validate deployment scripts
        run: sh ./deploy/test-deploy-scripts.sh
      - name: Verify Linux subscription privilege isolation
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/sbmgr-privilege.test" ./cmd/sbmgr
          sudo env SBMGR_RUN_PRIVILEGE_TEST=1 "$RUNNER_TEMP/sbmgr-privilege.test" -test.run '^TestSubscriptionPrivilege' -test.v
          sudo systemd-run --quiet --wait --pipe --collect \
            -p User=root -p Group=root -p NoNewPrivileges=true \
            -p PrivateTmp=true -p PrivateDevices=true -p ProtectSystem=strict \
            -p ProtectHome=read-only -p ProtectProc=invisible \
            -p ProtectKernelTunables=true -p ProtectKernelModules=true \
            -p ProtectControlGroups=true -p RestrictNamespaces=true \
            -p RestrictSUIDSGID=true -p RestrictRealtime=true -p LockPersonality=true \
            -p ProtectHostname=true -p MemoryDenyWriteExecute=true \
            -p 'CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_KILL CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID' \
            -p 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' \
            -p 'SystemCallFilter=@system-service' -p SystemCallErrorNumber=EPERM \
            -p LimitCORE=0 -p Environment=SBMGR_RUN_PRIVILEGE_TEST=1 \
            "$RUNNER_TEMP/sbmgr-privilege.test" -test.run '^TestSubscriptionPrivilege' -test.v
      - name: Cross-build Linux AMD64
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p .dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o .dist/sbmgr-ci-linux-amd64 ./cmd/sbmgr
      - name: Build tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./deploy/build-linux.sh
      - name: Attest tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: '.dist/sbmgr-*-linux-amd64'
      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbmgr-linux-amd64
          include-hidden-files: true
          path: |
            .dist/sbmgr-*-linux-amd64
            .dist/sbmgr-*-linux-amd64.sha256
          if-no-files-found: error
