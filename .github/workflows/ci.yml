name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check public repository tree
        run: python3 ./scripts/check_public_tree.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd)"
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          test_log="$(mktemp)"
          if go test ./... 2>&1 | tee "$test_log"; then
            exit 0
          fi
          summary="$(tail -n 20 "$test_log" | tr '\n' ' ')"
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\r'/'%0D'}"
          summary="${summary//$'\n'/'%0A'}"
          printf '::error title=Go test failed::%s\n' "$summary"
          exit 1
      - name: Validate deployment scripts
        run: sh ./deploy/test-deploy-scripts.sh
      - name: Cross-build Linux AMD64
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p .dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o .dist/sbmgr-ci-linux-amd64 ./cmd/sbmgr
      - name: Build tagged Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./deploy/build-linux.sh
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbmgr-linux-amd64
          include-hidden-files: true
          path: |
            .dist/sbmgr-*-linux-amd64
            .dist/sbmgr-*-linux-amd64.sha256
          if-no-files-found: error
