changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: 新功能
      labels: ["feature", "enhancement"]
    - title: 缺陷修复
      labels: ["bug", "fix"]
    - title: 安全与依赖
      labels: ["security", "dependencies"]
    - title: 文档、测试与 CI
      labels: ["documentation", "test", "ci"]
    - title: 其他变更
      labels: ["*"]
