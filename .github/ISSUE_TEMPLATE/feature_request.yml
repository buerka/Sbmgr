name: Feature request
description: 提出可验证的新功能或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、当前限制和受影响的角色（管理员/普通用户/部署方）。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期行为、默认值、生效时机和失败时的恢复方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响
      description: 兼容性、状态/schema 迁移、Web/CLI 边界、性能和运维成本。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 issue 和文档
          required: true
        - label: 提案不包含真实凭据、用户数据或私有部署细节
          required: true
